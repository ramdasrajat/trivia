<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GZ Trivia Live</title>
<style>
  :root{
    --bg1:#4338ca; --bg2:#7c3aed; --bg3:#db2777;
    --card:#ffffff; --ink:#1f2937; --muted:#6b7280;
    --a:#ef4444; --b:#3b82f6; --c:#f59e0b; --d:#10b981;
    --good:#16a34a; --bad:#dc2626;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;font-family:'Segoe UI',Arial,Helvetica,sans-serif;}
  body{
    min-height:100vh;
    background:linear-gradient(135deg,var(--bg1),var(--bg2) 55%,var(--bg3));
    background-size:200% 200%;
    animation:gradientMove 18s ease infinite;
    color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
  }
  @keyframes gradientMove{
    0%{background-position:0% 50%;} 50%{background-position:100% 50%;} 100%{background-position:0% 50%;}
  }
  .wrap{width:100%; max-width:920px;}
  .card{
    background:var(--card); border-radius:24px; padding:36px;
    box-shadow:0 20px 60px rgba(0,0,0,.35);
  }
  h1{font-size:2rem; margin:0 0 6px; font-weight:800;}
  h2{font-size:1.4rem; margin:0 0 16px; font-weight:700;}
  p.sub{color:var(--muted); margin:0 0 24px; font-size:1rem;}
  .btn{
    display:inline-flex; align-items:center; justify-content:center;
    padding:16px 28px; border-radius:14px; border:none; cursor:pointer;
    font-size:1.05rem; font-weight:700; color:#fff;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));
    box-shadow:0 8px 20px rgba(76,29,149,.35);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:hover{transform:translateY(-2px); box-shadow:0 12px 28px rgba(76,29,149,.45);}
  .btn:active{transform:translateY(0);}
  .btn.secondary{background:#f3f4f6; color:var(--ink); box-shadow:none;}
  .btn.big{width:100%; padding:22px; font-size:1.25rem; border-radius:18px; margin-bottom:14px;}
  .btn:disabled{opacity:.5; cursor:not-allowed; transform:none;}
  .row{display:flex; gap:14px; flex-wrap:wrap;}
  input[type=text]{
    width:100%; padding:16px 18px; font-size:1.15rem; border-radius:14px;
    border:2px solid #e5e7eb; margin-bottom:16px; font-weight:600;
    outline:none;
  }
  input[type=text]:focus{border-color:var(--bg2);}
  .code-display{
    font-size:3.2rem; font-weight:900; letter-spacing:.15em; text-align:center;
    background:#f3f4f6; border-radius:16px; padding:18px; margin:16px 0;
    color:var(--bg1);
  }
  .qr-box{display:flex; justify-content:center; margin:16px 0;}
  .qr-box canvas{border-radius:16px; border:6px solid #f3f4f6; image-rendering:pixelated;}
  .player-list{display:flex; flex-wrap:wrap; gap:10px; margin:16px 0;}
  .chip{
    background:#eef2ff; color:var(--bg1); padding:8px 16px; border-radius:999px;
    font-weight:700; font-size:.95rem;
  }
  .timer-row{display:flex; align-items:center; gap:14px; margin:10px 0 22px;}
  .timer-row .timerbar-track{flex:1; margin:0;}
  .timer-num{
    font-size:1.4rem; font-weight:900; color:var(--bg1); min-width:38px; text-align:right;
    font-variant-numeric:tabular-nums;
  }
  .timerbar-track{height:10px; background:#e5e7eb; border-radius:999px; overflow:hidden; margin:10px 0 22px;}
  .bonus-badge{
    display:inline-block; background:linear-gradient(135deg,#f59e0b,#f97316); color:#fff;
    font-size:.75rem; font-weight:800; padding:3px 10px; border-radius:999px; vertical-align:middle;
  }
  .rank-line{font-size:1.15rem; font-weight:700; margin-top:6px;}
  .timerbar-fill{height:100%; background:linear-gradient(90deg,var(--bg2),var(--bg3)); transition:width .2s linear;}
  .qtext{font-size:1.5rem; font-weight:800; margin-bottom:22px; line-height:1.35;}
  .opts{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media (max-width:560px){.opts{grid-template-columns:1fr;}}
  .opt{
    padding:22px 18px; border-radius:16px; color:#fff; font-weight:700; font-size:1.05rem;
    cursor:pointer; border:none; text-align:left; display:flex; gap:12px; align-items:flex-start;
    box-shadow:0 6px 16px rgba(0,0,0,.15); transition:transform .1s ease;
  }
  .opt:active{transform:scale(.97);}
  .opt.a{background:var(--a);} .opt.b{background:var(--b);} .opt.c{background:var(--c);} .opt.d{background:var(--d);}
  .opt.dim{opacity:.35; cursor:default;}
  .opt.correctpick{outline:4px solid #fff; box-shadow:0 0 0 4px var(--good);}
  .shape{font-size:1.3rem; line-height:1;}
  .center{text-align:center;}
  .muted{color:var(--muted);}
  .statbar-row{display:flex; align-items:center; gap:10px; margin:8px 0;}
  .statbar-track{flex:1; height:22px; background:#f3f4f6; border-radius:8px; overflow:hidden;}
  .statbar-fill{height:100%; border-radius:8px;}
  .leader-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 18px; border-radius:14px; background:#f9fafb; margin-bottom:10px; font-weight:700;
  }
  .leader-item.top1{background:linear-gradient(135deg,#fde68a,#fbbf24); }
  .leader-item.top2{background:#e5e7eb;}
  .leader-item.top3{background:#fed7aa;}
  .rank{width:34px; color:var(--muted); font-weight:800;}
  .flash{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; color:#fff; z-index:50; text-align:center; padding:20px;
  }
  .flash.good{background:linear-gradient(135deg,#16a34a,#22c55e);}
  .flash.bad{background:linear-gradient(135deg,#dc2626,#ef4444);}
  .flash h1{font-size:2.6rem; margin-bottom:8px;}
  .waiting-pulse{
    width:70px; height:70px; border-radius:50%; margin:0 auto 20px;
    background:radial-gradient(circle,var(--bg2),var(--bg1));
    animation:pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{transform:scale(1); opacity:1;} 50%{transform:scale(1.15); opacity:.7;}}
  .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .qnum{font-weight:800; color:var(--bg1);}
  .footer-link{margin-top:18px; text-align:center;}
  .footer-link a{color:var(--muted); font-size:.85rem; text-decoration:none;}
  .lock-msg{text-align:center; padding:40px 10px;}
  .err{color:var(--bad); font-weight:700; margin:-8px 0 12px;}
</style>
</head>
<body>
<div class="wrap"><div class="card" id="app"></div></div>

function isBonusQuestion(qi){ return (qi+1) % 5 === 0; } // every 5th question (Q5, Q10, ...)
function bonusMultiplier(qi){ return isBonusQuestion(qi) ? 2 : 1; }
// Kahoot-style speed scoring: faster correct answers score more (500-1000),
// doubled on bonus questions.
function scoreForAnswer(qi, elapsedMs, duration){
  const frac = Math.max(0, Math.min(1, elapsedMs/duration));
  const base = Math.round(500 + 500*(1-frac));
  return base * bonusMultiplier(qi);
}

// Gives each player a different, but STABLE, shuffled order of the 4 answer
// positions for a given question -- so someone shouting "pick C!" across the
// room doesn't help anyone else, since C means something different on every
// phone. Purely deterministic and computed locally (no extra DB calls,
// stable across refresh/resume): seeded from playerId + question index, so
// the same player always sees the same order for the same question, but
// different players see different orders. Taps still map back to the real
// answer underneath, so scoring is completely unaffected.
function seededShuffleOrder(seedStr, n){
  // Tiny deterministic string hash -> 32-bit seed.
  let h = 2166136261;
  for(let i=0;i<seedStr.length;i++){ h ^= seedStr.charCodeAt(i); h = Math.imul(h, 16777619); }
  // mulberry32 PRNG, seeded from the hash above.
  let state = h >>> 0;
  function rand(){
    state |= 0; state = (state + 0x6D2B79F5) | 0;
    let t = Math.imul(state ^ (state >>> 15), 1 | state);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const arr = Array.from({length:n}, (_,i)=>i);
  for(let i=n-1;i>0;i--){
    const j = Math.floor(rand()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}
function getMyDisplayOrder(qi){
  return seededShuffleOrder(`${S.playerId}:${qi}`, 4);
}

/* ---- Supabase (Postgres) key-value backend ----
   Table "kv" has two columns: key (text, primary key) and value (jsonb).
   See setup instructions for the one-time SQL to create it. */

// Tracks the last successful request, so screens can show a "synced Xs ago"
// indicator and players/host can tell at a glance if connectivity has
// degraded rather than just seeing things silently stop updating.
let lastSyncOk = null;   // timestamp of last successful request
let lastSyncFail = null; // timestamp of last failed request
function markSyncOk(){ lastSyncOk = Date.now(); }
function markSyncFail(){ lastSyncFail = Date.now(); }
// Short status string for the small "synced Xs ago" indicators, so a
// degraded connection is visible instead of things just silently stalling.
function syncStatusText(){
  if(!lastSyncOk && !lastSyncFail) return '';
  const now = Date.now();
  // A recent failure with no success since is worth flagging even if an
  // earlier success happened a while ago.
  if(lastSyncFail && (!lastSyncOk || lastSyncFail > lastSyncOk)){
    return 'Connection issue — retrying…';
  }
  const secs = Math.max(0, Math.round((now - lastSyncOk)/1000));
  return secs <= 2 ? 'Synced' : `Synced ${secs}s ago`;
}

async function sget(key){
  try{
    const { data, error } = await sb.from('kv').select('value').eq('key', key).maybeSingle();
    if(error) throw error;
    markSyncOk();
    return data ? data.value : null;
  }catch(e){ console.error('sget failed', key, e); markSyncFail(); return null; }
}
async function sset(key,val){
  try{
    const { error } = await sb.from('kv').upsert({ key, value: val });
    if(error) throw error;
    markSyncOk();
    return true;
  }catch(e){ console.error('sset failed', key, e); markSyncFail(); return false; }
}
async function slist(prefix){
  try{
    const { data, error } = await sb.from('kv').select('key').like('key', prefix + '%');
    if(error) throw error;
    markSyncOk();
    return data ? data.map(r => r.key) : [];
  }catch(e){ console.error('slist failed', prefix, e); markSyncFail(); return []; }
}
// Fetch every key+value under a prefix in ONE round trip (instead of listing
// keys then getting each one individually -- critical for scaling to many
// players, since an N+1 pattern would mean 200 requests for 200 players).
async function slistWithValues(prefix){
  try{
    const { data, error } = await sb.from('kv').select('key,value').like('key', prefix + '%');
    if(error) throw error;
    markSyncOk();
    return data ? data.map(r => ({ key:r.key, value:r.value })) : [];
  }catch(e){ console.error('slistWithValues failed', prefix, e); markSyncFail(); return []; }
}
// Lightweight count-only query (no row data transferred) -- used for the
// frequently-polled "how many have answered" check.
async function scount(prefix){
  try{
    const { count, error } = await sb.from('kv').select('key', { count:'exact', head:true }).like('key', prefix + '%');
    if(error) throw error;
    markSyncOk();
    return count || 0;
  }catch(e){ console.error('scount failed', prefix, e); markSyncFail(); return 0; }
}
// Bulk upsert: write many rows in ONE request instead of one request per row.
async function ssetMany(rows){
  if(!rows.length) return true;
  try{
    const { error } = await sb.from('kv').upsert(rows);
    if(error) throw error;
    markSyncOk();
    return true;
  }catch(e){ console.error('ssetMany failed', e); markSyncFail(); return false; }
}
// Deletes EVERY row in the table (used by the host's "Wipe all data" tool
// to clear out test/rehearsal rooms before the real event). All our keys
// are non-empty strings, so .neq('key','') matches every row.
async function wipeAllData(){
  try{
    const { error } = await sb.from('kv').delete().neq('key','');
    if(error) throw error;
    markSyncOk();
    return true;
  }catch(e){ console.error('wipeAllData failed', e); markSyncFail(); return false; }
}
// One-shot round-trip used by the "Test Connection" pre-flight check --
// writes and reads back a throwaway key, reporting success and latency.
async function testConnection(){
  const testKey = 'qz:__conntest__:' + Date.now();
  const start = performance.now();
  const wrote = await sset(testKey, { ping: true });
  if(!wrote) return { ok:false, ms:0 };
  const read = await sget(testKey);
  const ms = Math.round(performance.now() - start);
  return { ok: !!read, ms };
}

}

  }catch(e){ return null; }
}
function clearSession(){

function locationLooksUsable(){
  try{
    return location.href && !location.href.startsWith('about:') && location.protocol.startsWith('http');
  }catch(e){ return false; }

async function startHostFlow(){
  const code = genCode();
  S.role='host'; S.code=code;
  await sset(keyGame(code), { phase:'lobby', qIndex:-1, phaseStartedAt:0, phaseDuration:QDUR, stats:[0,0,0,0], answeredCount:0 });
  saveSession();
  S.screen='host_lobby';
  render();
}

// Rejoins an in-progress room as host after a refresh/crash, jumping to
// whichever screen matches the room's current phase in the database.
async function resumeAsHost(saved, el){
  const g = await sget(keyGame(saved.code));
  if(!g){
    const local = loadSession();
    const isOwnSavedSession = local && local.role==='host' && local.code===saved.code;
    if(isOwnSavedSession){
      // Their own remembered room is genuinely gone -- safe to clear it
      // and send them back to a clean landing screen.
      alert("That room no longer exists (it may have been wiped or the game finished a while ago).");
      clearSession();
      renderLanding(el);
    } else {
      // Manual code entry that just doesn't match anything -- show inline,
      // don't touch whatever session (if any) is already saved on this device.
      const msg = document.getElementById('resumeCodeMsg');
      if(msg) msg.textContent = 'No room found with that code.';
    }
    return;
  }
  S.role='host'; S.code=saved.code;
  saveSession();
  if(g.phase==='lobby') S.screen='host_lobby';
  else if(g.phase==='question') S.screen='host_question';
  else if(g.phase==='reveal') S.screen='host_reveal';
  else S.screen='host_end';
  render();
}

// Rejoins an in-progress game as a player after a refresh/locked screen,
// jumping to whichever screen matches the room's current phase.
async function resumeAsPlayer(saved, el){
  const g = await sget(keyGame(saved.code));
  const prec = await sget(keyPlayer(saved.code, saved.playerId));
  if(!g || !prec){
    // Room or player record is gone -- fall back to a normal join screen.
    clearSession();
    S.screen='join';
    renderJoin(el);
    return;
  }
  S.role='player'; S.code=saved.code; S.playerId=saved.playerId; S.playerName=saved.playerName || prec.name;
  saveSession();
  if(g.phase==='lobby'){ S.screen='player_wait'; render(); }
  else if(g.phase==='question'){ S.myAnswer=null; S.screen='player_question'; render(); }
  else if(g.phase==='reveal'){ checkResult(g.qIndex); }
  else { S.screen='player_end'; render(); }
}

      stopPolling();
      await hostSkipQuestion(qi);
    };
    wireHostToolsRow();

    // Player count barely changes mid-question, so fetch it once (cheap,
    // count-only query) rather than on every poll cycle.
    let totalPlayers = await scount(keyPlayersPrefix(S.code));
    let answeredCount = 0;
    let revealTriggered = false;

    // Fast, purely local visual tick -- no network call, so this can run
    // smoothly at 250ms regardless of how many players are connected.
    function visualTick(){
      const elapsed = Date.now()-g.phaseStartedAt;
      const remainingMs = Math.max(0, g.phaseDuration - elapsed);
      const pct = Math.max(0, 100 - (elapsed/g.phaseDuration*100));
      const tf = $('#tfill'); if(tf) tf.style.width = pct+'%';
      const tn = $('#tnum'); if(tn) tn.textContent = Math.ceil(remainingMs/1000);
      const ss = $('#syncStatus'); if(ss) ss.textContent = syncStatusText();
      if(elapsed >= g.phaseDuration && !revealTriggered){ revealTriggered=true; hostReveal(); }
    }

    // Slower network poll -- only checks the answer count (one lightweight
    // count-only query), independent of how often the visual bar updates.
    async function netTick(){
      if(revealTriggered) return;
      answeredCount = await scount(keyAnsPrefix(S.code, qi));
      const ac = $('#ansCount'); if(ac) ac.textContent = answeredCount + ' / ' + totalPlayers + ' answered';
      const allAnswered = totalPlayers > 0 && answeredCount >= totalPlayers;
      if(allAnswered && !revealTriggered){ revealTriggered=true; hostReveal(); }
    }

    visualTick();
    netTick();
    S.tickTimer = setInterval(visualTick, 250);
    S.netTimer = setInterval(netTick, 1000);
  });
}

async function hostReveal(){
  if(S._revealing) return;
  S._revealing = true;
  stopPolling();
  const g = await sget(keyGame(S.code));
  if(!g || g.phase==='reveal'){ S._revealing=false; return; }
  const qi = g.qIndex;
  const [,,correctIdx] = QUESTIONS[qi];

  // Two bulk reads (not N individual ones) regardless of player count.
  const [answerRows, playerRows] = await Promise.all([
    slistWithValues(keyAnsPrefix(S.code, qi)),
    slistWithValues(keyPlayersPrefix(S.code)),
  ]);

  const playerMap = new Map(); // id -> player record
  for(const r of playerRows){
    if(r.value) playerMap.set(r.key.split(':').pop(), { key:r.key, ...r.value });
  }

  const stats=[0,0,0,0];
  const answeredIds = new Set();
  for(const r of answerRows){
    const ans = r.value;
    if(!ans) continue;
    stats[ans.optionIdx] = (stats[ans.optionIdx]||0)+1;
    const isCorrect = ans.optionIdx===correctIdx;
    const gained = isCorrect ? scoreForAnswer(qi, ans.ts - g.phaseStartedAt, g.phaseDuration) : 0;
    const pid = r.key.split(':').pop();
    answeredIds.add(pid);
    const prec = playerMap.get(pid);
    if(prec){
      prec.score = (prec.score||0) + gained;
      prec.lastGain = gained;
      prec.lastCorrect = isCorrect;
    }
  }
  // Anyone who didn't answer gets lastGain/lastCorrect reset so their reveal
  // screen doesn't show a stale result carried over from a prior question.
  for(const [pid, prec] of playerMap){
    if(answeredIds.has(pid)) continue;
    prec.lastGain = 0;
    prec.lastCorrect = false;
  }

  // One bulk write for every player's updated record, instead of one
  // request per player.
  const rowsToWrite = [...playerMap.values()].map(p => {
    const { key, ...rest } = p;
    return { key, value: rest };
  });
  await ssetMany(rowsToWrite);

  await sset(keyGame(S.code), { ...g, phase:'reveal', stats, answeredCount: answerRows.length, revealStartedAt: Date.now() });
  S._revealing = false;
  S.screen='host_reveal';
  render();
}

    tick();
    S.tickTimer = setInterval(tick, 250);
  });
}

function renderJoin(el){
  stopPolling();
  const urlCode = new URLSearchParams(location.search).get('code') || '';
  el.innerHTML = `
    <h2>Join Quiz</h2>
    <div id="errBox"></div>
    <input type="text" id="codeInput" placeholder="Room code" value="${escapeHtml(urlCode)}" maxlength="6" inputmode="numeric">
    <input type="text" id="nameInput" placeholder="Your name" maxlength="24">
    <button class="btn big" id="joinSubmit">Join</button>
    ${urlCode ? '' : '<button class="btn secondary" id="backBtn">Back</button>'}
    <div class="footer-link"><a href="#" id="howToLink2">How to play</a></div>
  `;
  if(!urlCode){
    $('#backBtn').onclick = ()=>{ S.screen='landing'; render(); };
  }
  $('#howToLink2').onclick = (e)=>{ e.preventDefault(); showHowToPlayModal(); };
  $('#joinSubmit').onclick = async ()=>{
    const code = $('#codeInput').value.trim();
    let name = $('#nameInput').value.trim();
    if(!code || !name){ $('#errBox').innerHTML = '<div class="err">Enter a room code and your name</div>'; return; }
    const g = await sget(keyGame(code));
    if(!g){ $('#errBox').innerHTML = '<div class="err">Room not found. Check the code.</div>'; return; }
    if(g.phase==='ended'){ $('#errBox').innerHTML = '<div class="err">This quiz has already finished.</div>'; return; }

    // Avoid a confusing duplicate-looking leaderboard by auto-suffixing a
    // repeated name (e.g. two "Alex"s -> "Alex" and "Alex (2)").
    const { players: existing } = await getSortedPlayers(code);
    const takenNames = new Set(existing.map(p=>p.name));
    if(takenNames.has(name)){
      let n = 2;
      while(takenNames.has(`${name} (${n})`)) n++;
      name = `${name} (${n})`;
    }

    S.role='player'; S.code=code; S.playerId=genId(); S.playerName=name;
    await sset(keyPlayer(code, S.playerId), { name, score:0, joinedAt:Date.now() });
    saveSession();

    // Route straight to the screen matching where the game actually is,
    // rather than always showing "waiting for host to start" -- a late
    // joiner mid-question should see the live question immediately, and
    // one joining during a reveal should see an honest "in progress" message.
    if(g.phase==='question'){ S.myAnswer=null; S.screen='player_question'; render(); }
    else if(g.phase==='reveal'){ S.screen='player_wait'; render(); }
    else { S.screen='player_wait'; render(); }
  };
}

    async function submitAnswer(idx, btn){
      S.myAnswer = idx;
      document.querySelectorAll('#optsWrap .opt').forEach(x=>{
        if(x!==btn) x.classList.add('dim');
      });
      const statusEl = $('#answerStatus');
      statusEl.textContent = 'Saving your answer…';
      const ok = await sset(keyAns(S.code, qi, S.playerId), { optionIdx: idx, ts: Date.now() });
      if(ok){
        statusEl.textContent = 'Answer locked in!';
      } else {
        // Let them retry -- silently failing here would just look broken.
        statusEl.innerHTML = "Couldn't save your answer — <a href='#' id='retryAnswerLink'>tap to try again</a>.";
        document.getElementById('retryAnswerLink').onclick = (e)=>{
          e.preventDefault();
          S.myAnswer = null;
          document.querySelectorAll('#optsWrap .opt').forEach(x=>x.classList.remove('dim'));
          statusEl.textContent = '';
        };
      }
    }
    document.querySelectorAll('#optsWrap .opt').forEach(b=>{
      b.onclick = ()=>{
        if(S.myAnswer!==null) return;
        const idx = parseInt(b.getAttribute('data-i'),10);
        submitAnswer(idx, b);
      };
    });

    // Fast local visual tick -- pure client-side math, no network call, so
    // this stays smooth no matter how many players are connected.
    function visualTick(){
      const elapsed = Date.now()-g.phaseStartedAt;
      const remainingMs = Math.max(0, g.phaseDuration - elapsed);
      const pct = Math.max(0, 100 - (elapsed/g.phaseDuration*100));
      const tf = $('#tfill'); if(tf) tf.style.width = pct+'%';
      const tn = $('#tnum'); if(tn) tn.textContent = Math.ceil(remainingMs/1000);
      const ss = $('#syncStatus'); if(ss) ss.textContent = syncStatusText();
    }
    // Slower network poll -- checks whether the host has moved the game
    // phase past 'question' (normal reveal), OR jumped straight to a new
    // question index while still in 'question' phase (host used "Skip This
    // Question" -- no reveal happened, so just follow along silently rather
    // than showing stale/incorrect reveal info for the skipped question).
    let transitioned = false;
    async function netTick(){
      if(transitioned) return;
      const gg = await sget(keyGame(S.code));
      if(!gg) return;
      if(gg.phase!=='question'){ transitioned=true; checkResult(qi); }
      else if(gg.qIndex!==qi){ transitioned=true; S.myAnswer=null; S.screen='player_question'; render(); }
    }
    visualTick();
    netTick();
    S.tickTimer = setInterval(visualTick, 250);
    S.netTimer = setInterval(netTick, 1000);
  });
}

async function checkResult(qi){
  stopPolling();
  const [,,correctIdx] = QUESTIONS[qi];
  const prec = await sget(keyPlayer(S.code, S.playerId));
  const { players } = await getSortedPlayers(S.code);
  const myRank = players.findIndex(p=>p.id===S.playerId) + 1;
  S.revealResult = {
    isCorrect: !!(prec && prec.lastCorrect),
    noAnswer: S.myAnswer===null,
    gained: prec ? (prec.lastGain||0) : 0,
    score: prec ? (prec.score||0) : 0,
    rank: myRank || players.length,
    total: players.length,
  };
  S.screen='player_reveal';
  render();
}

async function getSortedPlayers(code){
  const rows = await slistWithValues(keyPlayersPrefix(code));
  const players = rows
    .filter(r => r.value)
    .map(r => ({ id: r.key.split(':').pop(), ...r.value }));
  players.sort((a,b)=>(b.score||0)-(a.score||0));
  return { players };
}

}

// Shared "Home" navigation for the host, present on every host screen so a
// mis-tap or wanting to check something on the landing page never requires
// a hard refresh. Live-game screens ask for confirmation first -- though
// leaving is actually harmless (the room's timer is wall-clock based, so
// "Resume Hosting" from the home screen picks up exactly where it left off,
// even auto-revealing immediately if time already ran out while away).
function homeLinkHtml(){
  return `<div class="footer-link" style="text-align:left; margin-bottom:12px;"><a href="#" id="homeLink">&larr; Home</a></div>`;
}
function wireHomeLink(confirmMsg){
  const link = document.getElementById('homeLink');
  if(!link) return;
  link.onclick = (e)=>{
    e.preventDefault();
    if(confirmMsg && !confirm(confirmMsg)) return;
    stopPolling();
    S.screen='landing';
    render();
  };
}

/* ============ QR CODE (client-side, no network) ============ */
function drawQR(canvasId, text, sizePx){
  const canvas = document.getElementById(canvasId);
  if(!canvas || typeof qrcode==='undefined') return;
  const qr = qrcode(0, 'M');
  qr.addData(text);
  qr.make();
  const n = qr.getModuleCount();
  const scale = Math.floor(sizePx / n) || 1;
  const renderSize = scale * n;
  canvas.width = renderSize; canvas.height = renderSize;
  canvas.style.width = sizePx+'px'; canvas.style.height = sizePx+'px';
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0,0,renderSize,renderSize);
  ctx.fillStyle = '#111827';
  for(let r=0;r<n;r++){
    for(let c=0;c<n;c++){
      if(qr.isDark(r,c)) ctx.fillRect(c*scale, r*scale, scale, scale);
    }
  }
}
